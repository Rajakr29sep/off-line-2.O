<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Arial, Helvetica, sans-serif">
  <rect width="1600" height="980" fill="#f4f1ea"/>
  <!-- outdoor areas -->
  <rect x="1400" y="0" width="200" height="980" fill="#e3ead9"/>
  <rect x="0" y="900" width="1600" height="80" fill="#e3ead9"/>
  <rect x="0" y="0" width="60" height="980" fill="#e3ead9"/>
  <text x="1444" y="40" font-size="20" fill="#55704a" font-weight="bold">EAST YARD</text>
  <text x="200" y="955" font-size="18" fill="#55704a" font-weight="bold">SOUTH ACCESS ROAD</text>
  <!-- building shell -->
  <rect x="80" y="80" width="1300" height="800" fill="#ffffff" stroke="#1f2937" stroke-width="10"/>
  <!-- rooms -->
  <g fill="#fbfaf7" stroke="#374151" stroke-width="4">
    <rect x="80" y="80" width="410" height="360"/>
    <rect x="490" y="80" width="420" height="360"/>
    <rect x="910" y="80" width="260" height="360" fill="#fff1e6"/>
    <rect x="1170" y="80" width="210" height="220" fill="#fde8e8"/>
    <rect x="1170" y="300" width="210" height="140"/>
    <rect x="80" y="540" width="530" height="340"/>
    <rect x="610" y="540" width="300" height="340"/>
    <rect x="910" y="540" width="200" height="160" fill="#e8f6ee"/>
    <rect x="1110" y="540" width="270" height="160"/>
    <rect x="910" y="700" width="470" height="180"/>
  </g>
  <!-- main corridor -->
  <rect x="84" y="444" width="1292" height="92" fill="#eef2f7"/>
  <text x="666" y="497" font-size="18" fill="#64748b" letter-spacing="6">MAIN CORRIDOR</text>
  <!-- door gaps -->
  <g stroke="#ffffff" stroke-width="12">
    <line x1="250" y1="440" x2="310" y2="440"/>
    <line x1="670" y1="440" x2="730" y2="440"/>
    <line x1="1010" y1="440" x2="1070" y2="440"/>
    <line x1="310" y1="540" x2="370" y2="540"/>
    <line x1="730" y1="540" x2="790" y2="540"/>
    <line x1="980" y1="540" x2="1040" y2="540"/>
    <line x1="1220" y1="540" x2="1280" y2="540"/>
    <line x1="1240" y1="440" x2="1290" y2="440"/>
  </g>
  <!-- exits in outer wall -->
  <g stroke="#16a34a" stroke-width="14">
    <line x1="80" y1="455" x2="80" y2="525"/>
    <line x1="1380" y1="455" x2="1380" y2="525"/>
    <line x1="725" y1="880" x2="795" y2="880"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#15803d">
    <text x="92" y="430">◀ WEST EXIT</text>
    <text x="1268" y="430" text-anchor="end">EAST EXIT ▶</text>
    <text x="707" y="870">SOUTH EXIT ▼</text>
  </g>
  <!-- room labels -->
  <g font-size="22" font-weight="bold" fill="#111827">
    <text x="194" y="150">ASSEMBLY LINE A</text>
    <text x="609" y="150">ASSEMBLY LINE B</text>
    <text x="980" y="150">PAINT SHOP</text>
    <text x="1235" y="140" font-size="18">CHEMICAL</text>
    <text x="1250" y="162" font-size="18">STORE</text>
    <text x="1228" y="370" font-size="17">ELECTRICAL</text>
    <text x="291" y="620">WAREHOUSE</text>
    <text x="718" y="620">CANTEEN</text>
    <text x="965" y="590" font-size="18">FIRST AID</text>
    <text x="1215" y="590" font-size="18">QA LAB</text>
    <text x="1103" y="760">OFFICES</text>
  </g>
  <g font-size="14" fill="#9a3412">
    <text x="951" y="175">solvents · spray booths</text>
    <text x="1236" y="190" fill="#b91c1c">RESTRICTED</text>
  </g>
  <!-- machinery / shelving -->
  <g fill="#d1d5db" stroke="#6b7280" stroke-width="2">
    <rect x="130" y="200" width="300" height="34"/><rect x="130" y="300" width="300" height="34"/>
    <rect x="540" y="200" width="320" height="34"/><rect x="540" y="300" width="320" height="34"/>
    <rect x="130" y="660" width="40" height="190"/><rect x="230" y="660" width="40" height="190"/>
    <rect x="330" y="660" width="40" height="190"/><rect x="430" y="660" width="40" height="190"/>
    <rect x="950" y="220" width="70" height="120"/><rect x="1060" y="220" width="70" height="120"/>
  </g>
  <g fill="#e5e7eb" stroke="#9ca3af" stroke-width="2">
    <rect x="650" y="660" width="90" height="40" rx="6"/><rect x="780" y="660" width="90" height="40" rx="6"/>
    <rect x="650" y="760" width="90" height="40" rx="6"/><rect x="780" y="760" width="90" height="40" rx="6"/>
  </g>
  <!-- stairs -->
  <g stroke="#4b5563" stroke-width="2">
    <rect x="1290" y="580" width="70" height="100" fill="#f3f4f6"/>
    <line x1="1290" y1="600" x2="1360" y2="600"/><line x1="1290" y1="620" x2="1360" y2="620"/>
    <line x1="1290" y1="640" x2="1360" y2="640"/><line x1="1290" y1="660" x2="1360" y2="660"/>
  </g>
  <text x="1296" y="700" font-size="13" fill="#374151">STAIRS ↑</text>
  <!-- title block -->
  <rect x="1100" y="905" width="290" height="62" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <text x="1112" y="928" font-size="15" font-weight="bold" fill="#111827">SAMPLE FACTORY — PLANT 2</text>
  <text x="1112" y="948" font-size="12" fill="#374151">Ground floor · simulated demo layout</text>
  <text x="1112" y="962" font-size="11" fill="#6b7280">Not a real building. OfflineAid sample data.</text>
  <!-- north arrow -->
  <g transform="translate(1540,920)"><polygon points="0,-30 10,0 -10,0" fill="#1f2937"/><text y="20" font-size="14">N</text></g>
</svg>
